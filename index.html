<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Appel Gratuit</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #1a1d21; --muted: #5f6b76;
    --green: #1e9e57; --red: #d93a3a; --blue: #2468d6; --border: #d9dee3; --warn: #fff4d6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --card: #1c2025; --text: #eef1f4; --muted: #9aa5b0; --border: #2e343b; --warn: #3a3218; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
    font-size: 20px; line-height: 1.4;
  }
  main { max-width: 480px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 30px; margin: 0 0 20px; text-align: center; }
  h2 { font-size: 22px; margin: 0 0 12px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    padding: 20px; margin-bottom: 16px;
  }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input {
    width: 100%; font-size: 22px; padding: 14px; border-radius: 12px;
    border: 2px solid var(--border); background: var(--bg); color: var(--text);
  }
  button {
    width: 100%; font-size: 22px; font-weight: 700; padding: 18px; margin-top: 12px;
    border: 0; border-radius: 14px; color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }
  .green { background: var(--green); }
  .red { background: var(--red); }
  .blue { background: var(--blue); }
  .grey { background: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .myid { font-size: 28px; font-weight: 800; text-align: center; letter-spacing: 1px; }
  .status { text-align: center; color: var(--muted); min-height: 28px; }
  .hidden { display: none !important; }
  .timer { font-size: 40px; font-weight: 800; text-align: center; }
  .ring { animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .55; } }
  .banner {
    background: var(--warn); border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; text-align: center; margin-bottom: 16px; cursor: pointer;
  }
  .contact {
    display: grid; grid-template-columns: 1fr 64px 64px 44px; gap: 8px; align-items: center;
    padding: 8px 0; border-top: 1px solid var(--border);
  }
  .contact:first-child { border-top: 0; }
  .contact .who { font-size: 22px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .contact button { margin: 0; padding: 14px 0; font-size: 24px; }
  .contact .del { background: transparent; color: var(--muted); font-size: 20px; }
  .videos { position: relative; margin: 12px 0; border-radius: 14px; overflow: hidden; background: #000; }
  #remoteVideo { width: 100%; display: block; aspect-ratio: 3 / 4; object-fit: cover; }
  #localVideo {
    position: absolute; right: 10px; bottom: 10px; width: 30%; border-radius: 10px;
    border: 2px solid #fff; transform: scaleX(-1);
  }
</style>
</head>
<body>
<main>
  <h1>📞 Appel Gratuit</h1>

  <!-- Étape 1 : choisir son nom -->
  <section id="setup" class="card">
    <label for="name">Ton nom (ex : oncle-paul)</label>
    <input id="name" autocomplete="off" autocapitalize="off">
    <button class="blue" id="saveName">Commencer</button>
  </section>

  <!-- Étape 2 : prêt à appeler -->
  <section id="ready" class="hidden">
    <div id="soundBanner" class="banner hidden">🔔 Touche ici une fois pour activer la sonnerie</div>
    <div class="card">
      <div class="status">Ton nom pour être appelé :</div>
      <div class="myid" id="myId"></div>
      <div class="status" id="netStatus">Connexion…</div>
    </div>
    <div class="card">
      <h2>Mes contacts</h2>
      <div id="contacts"></div>
    </div>
    <div class="card">
      <label for="friend">Appeler quelqu'un d'autre</label>
      <input id="friend" autocomplete="off" autocapitalize="off" placeholder="son nom">
      <div class="row">
        <button class="green" id="callBtn">📞 Audio</button>
        <button class="blue" id="videoBtn">🎥 Vidéo</button>
      </div>
    </div>
    <button class="grey" id="changeName">Changer mon nom</button>
  </section>

  <!-- Appel entrant -->
  <section id="incoming" class="card hidden">
    <div class="myid ring" id="callerName"></div>
    <div class="status" id="callerKind">t'appelle…</div>
    <button class="green" id="acceptBtn">✅ Répondre</button>
    <button class="red" id="rejectBtn">❌ Refuser</button>
  </section>

  <!-- En appel -->
  <section id="inCall" class="card hidden">
    <div class="status" id="callWith"></div>
    <div class="timer" id="timer">00:00</div>
    <div class="videos hidden" id="videos">
      <video id="remoteVideo" autoplay playsinline muted></video>
      <video id="localVideo" autoplay playsinline muted></video>
    </div>
    <div class="row">
      <button class="grey" id="muteBtn">🔇 Micro</button>
      <button class="grey" id="camBtn">📷 Caméra</button>
    </div>
    <button class="red" id="hangupBtn">Raccrocher</button>
  </section>

  <audio id="remoteAudio" autoplay playsinline></audio>
</main>

<script>
const PREFIX = "appelgratuit-v1-"; // évite les collisions avec d'autres apps PeerJS
const RING_TIMEOUT = 45000;
const $ = id => document.getElementById(id);
const shortName = id => id.replace(PREFIX, "");
let peer, currentCall, localStream, timerId, incomingCall, connected = false, ringTimeout;

function clean(s) {
  return s.trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[^a-z0-9-]+/g, "-").replace(/^-+|-+$/g, "");
}
function show(id) {
  for (const s of ["setup", "ready", "incoming", "inCall"]) $(s).classList.toggle("hidden", s !== id);
}
function load(key) { try { return localStorage.getItem(key); } catch { return null; } }
function store(key, v) { try { v == null ? localStorage.removeItem(key) : localStorage.setItem(key, v); } catch {} }

// ---------- Sonnerie (générée, sans fichier audio) ----------
let audioCtx, toneId;
function ac() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function updateSoundBanner() {
  $("soundBanner").classList.toggle("hidden", !!audioCtx && audioCtx.state === "running");
}
// Les navigateurs n'autorisent le son qu'après un premier toucher sur la page.
document.addEventListener("pointerdown", () => { ac().resume().then(updateSoundBanner); });

function beep(freq, dur, t) {
  const c = ac(), o = c.createOscillator(), g = c.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(c.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
function startTone(kind) {
  stopTone();
  const play = kind === "ring"
    ? () => {
        const t = ac().currentTime;
        [880, 660, 880, 660].forEach((f, i) => beep(f, 0.15, t + i * 0.2));
        navigator.vibrate?.([400, 200, 400]);
      }
    : () => beep(425, 1, ac().currentTime); // tonalité « ça sonne » pour celui qui appelle
  play();
  toneId = setInterval(play, kind === "ring" ? 2000 : 3000);
}
function stopTone() {
  clearInterval(toneId);
  navigator.vibrate?.(0);
  document.title = "Appel Gratuit";
}

// ---------- Contacts ----------
function getContacts() {
  try { return JSON.parse(load("contacts")) || []; } catch { return []; }
}
function addContact(name) {
  const list = getContacts().filter(n => n !== name);
  list.unshift(name); // le plus récent en premier
  store("contacts", JSON.stringify(list));
  renderContacts();
}
function removeContact(name) {
  if (!confirm("Supprimer " + name + " de tes contacts ?")) return;
  store("contacts", JSON.stringify(getContacts().filter(n => n !== name)));
  renderContacts();
}
function renderContacts() {
  const box = $("contacts"), list = getContacts();
  box.innerHTML = "";
  if (!list.length) {
    box.innerHTML = '<div class="status">Aucun contact pour l\'instant. Ils s\'ajoutent tout seuls après un appel.</div>';
    return;
  }
  for (const name of list) {
    const row = document.createElement("div");
    row.className = "contact";
    const who = document.createElement("div");
    who.className = "who"; who.textContent = name;
    const audio = document.createElement("button");
    audio.className = "green"; audio.textContent = "📞"; audio.title = "Appel audio";
    audio.onclick = () => startCall(name, false);
    const video = document.createElement("button");
    video.className = "blue"; video.textContent = "🎥"; video.title = "Appel vidéo";
    video.onclick = () => startCall(name, true);
    const del = document.createElement("button");
    del.className = "del"; del.textContent = "✕"; del.title = "Supprimer";
    del.onclick = () => removeContact(name);
    row.append(who, audio, video, del);
    box.append(row);
  }
}

// ---------- Messages courts entre téléphones (refus, annulation) ----------
function sendSignal(peerId, type) {
  const conn = peer.connect(peerId);
  conn.on("open", () => { conn.send({ type }); setTimeout(() => conn.close(), 1500); });
}
function onSignal(conn) {
  conn.on("data", d => {
    if (d.type === "reject" && currentCall && !connected && currentCall.peer === conn.peer) {
      endCall(); alert(shortName(conn.peer) + " a refusé l'appel.");
    }
    if (d.type === "cancel" && incomingCall && incomingCall.peer === conn.peer) {
      stopIncoming();
    }
  });
}

// ---------- Appels ----------
async function getMedia(video) {
  const audio = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
  if (video) {
    try { return await navigator.mediaDevices.getUserMedia({ audio, video: { facingMode: "user" } }); }
    catch { alert("Caméra indisponible, l'appel continue en audio."); }
  }
  return navigator.mediaDevices.getUserMedia({ audio });
}

function start(name) {
  $("myId").textContent = name;
  $("netStatus").textContent = "Connexion…";
  renderContacts();
  updateSoundBanner();
  show("ready");
  if (peer) peer.destroy();
  peer = new Peer(PREFIX + name);
  peer.on("open", () => $("netStatus").textContent = "✅ Prêt à appeler et recevoir");
  peer.on("disconnected", () => { $("netStatus").textContent = "Reconnexion…"; peer.reconnect(); });
  peer.on("error", err => {
    if (err.type === "unavailable-id") $("netStatus").textContent = "⚠️ Ce nom est déjà pris, choisis-en un autre.";
    else if (err.type === "peer-unavailable") {
      if (currentCall && !connected) { endCall(); alert("Cette personne n'est pas connectée en ce moment."); }
    }
    else $("netStatus").textContent = "⚠️ Erreur : " + err.type;
  });
  peer.on("connection", onSignal);
  peer.on("call", call => {
    if (currentCall || incomingCall) { call.close(); return; } // déjà en ligne
    incomingCall = call;
    const who = shortName(call.peer), video = !!call.metadata?.video;
    $("callerName").textContent = who;
    $("callerKind").textContent = video ? "🎥 t'appelle en vidéo…" : "📞 t'appelle…";
    show("incoming");
    startTone("ring");
    document.title = "📞 Appel de " + who;
    ringTimeout = setTimeout(stopIncoming, RING_TIMEOUT);
    call.on("close", stopIncoming);
  });
}

function stopIncoming() {
  if (!incomingCall) return;
  clearTimeout(ringTimeout);
  stopTone();
  incomingCall = null;
  show("ready");
}

async function startCall(friend, video) {
  if (!friend) return alert("Écris le nom de la personne.");
  if (currentCall) return;
  let stream;
  try { stream = await getMedia(video); }
  catch { return alert("Il faut autoriser le micro pour appeler."); }
  localStream = stream;
  const call = peer.call(PREFIX + friend, stream, { metadata: { video: stream.getVideoTracks().length > 0 } });
  attach(call);
  $("timer").textContent = "Ça sonne…";
  startTone("ringback");
  ringTimeout = setTimeout(() => {
    if (!connected) { endCall(); alert("Pas de réponse."); }
  }, RING_TIMEOUT);
}

function attach(call) {
  currentCall = call;
  connected = false;
  const hasVideo = localStream.getVideoTracks().length > 0;
  $("callWith").textContent = (hasVideo ? "🎥 " : "📞 ") + shortName(call.peer);
  $("camBtn").classList.toggle("hidden", !hasVideo);
  $("localVideo").srcObject = hasVideo ? localStream : null;
  show("inCall");
  call.on("stream", stream => {
    if (connected) return; // l'événement peut arriver deux fois
    connected = true;
    clearTimeout(ringTimeout);
    stopTone();
    addContact(shortName(call.peer));
    $("remoteAudio").srcObject = stream;
    const remoteVideo = stream.getVideoTracks().length > 0;
    $("remoteVideo").srcObject = remoteVideo ? stream : null;
    $("videos").classList.toggle("hidden", !remoteVideo && !hasVideo);
    const t0 = Date.now();
    clearInterval(timerId);
    $("timer").textContent = "00:00";
    timerId = setInterval(() => {
      const s = Math.floor((Date.now() - t0) / 1000);
      $("timer").textContent = String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0");
    }, 1000);
  });
  call.on("close", endCall);
  call.on("error", endCall);
}

function endCall() {
  clearInterval(timerId);
  clearTimeout(ringTimeout);
  stopTone();
  if (currentCall) {
    const c = currentCall; currentCall = null;
    if (!connected) sendSignal(c.peer, "cancel"); // fait arrêter la sonnerie chez l'autre
    c.close();
  }
  connected = false;
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  for (const id of ["remoteAudio", "remoteVideo", "localVideo"]) $(id).srcObject = null;
  $("videos").classList.add("hidden");
  $("muteBtn").textContent = "🔇 Micro";
  $("camBtn").textContent = "📷 Caméra";
  show("ready");
}

$("saveName").onclick = () => {
  const name = clean($("name").value);
  if (!name) return alert("Écris un nom.");
  store("name", name);
  start(name);
};
$("changeName").onclick = () => { store("name", null); if (peer) peer.destroy(); show("setup"); };
$("soundBanner").onclick = () => ac().resume().then(updateSoundBanner);

$("callBtn").onclick = () => startCall(clean($("friend").value), false);
$("videoBtn").onclick = () => startCall(clean($("friend").value), true);

$("acceptBtn").onclick = async () => {
  const call = incomingCall;
  clearTimeout(ringTimeout);
  stopTone();
  incomingCall = null;
  try { localStream = await getMedia(!!call.metadata?.video); }
  catch { alert("Il faut autoriser le micro pour répondre."); call.close(); show("ready"); return; }
  call.answer(localStream);
  attach(call);
};
$("rejectBtn").onclick = () => {
  const call = incomingCall;
  stopIncoming();
  sendSignal(call.peer, "reject");
  call.close();
};
$("hangupBtn").onclick = endCall;
$("muteBtn").onclick = () => {
  const track = localStream?.getAudioTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $("muteBtn").textContent = track.enabled ? "🔇 Micro" : "🎤 Réactiver";
};
$("camBtn").onclick = () => {
  const track = localStream?.getVideoTracks()[0];
  if (!track) return;
  track.enabled = !track.enabled;
  $("camBtn").textContent = track.enabled ? "📷 Caméra" : "📷 Réactiver";
};

const saved = load("name");
if (saved) start(saved); else show("setup");
</script>
</body>
</html>
